; The configuration file for the "Custom skies" plugin
; Only ";" is a comment symbol (it also works at the end of a line)
;
; [list random skies]
;   Names of sky textures (without the side suffixes bk/dn/ft/lf/rt/up), one per line.
;   One of them is picked at random on every map that has no line in [map settings].
;
; [map settings]
;   <mapname> = <sky>[, <sky>, ...]
;   - one sky      - this sky is always set on the map
;   - several      - one of them is picked at random on the map
;   - none         - no sky is set, the skybox built into the map is used
;                    (can be mixed with names: then it is one of the random options)
;   If none of the listed skies is valid (files are missing), [list random skies] is used.
;   If a map is written several times, the last line wins.
;
;
; Файл конфигурации для плагина "Custom skies"
; Символ комментария только ";" (работает и в конце строки)
;
; [list random skies]
;   Названия текстур неба (без суффиксов сторон bk/dn/ft/lf/rt/up), по одному в строке.
;   Одно из них случайно ставится на каждой карте, которой нет в [map settings].
;
; [map settings]
;   <карта> = <небо>[, <небо>, ...]
;   - одно небо    - на карте всегда ставится это небо
;   - несколько    - на карте случайно выбирается одно из них
;   - none         - небо не ставится, остаётся скайбокс, вшитый в карту
;                    (можно смешать с названиями: тогда это один из вариантов случайного выбора)
;   Если ни одно из перечисленных небес не годится (нет файлов), используется [list random skies].
;   Если карта записана несколько раз, действует последняя строка.

[list random skies]
nebulous
plume

[map settings]
; de_dust2 = none
; de_inferno = nebulous
; de_nuke = nebulous, plume
